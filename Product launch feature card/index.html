<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Product launch card</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Style.css">
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="card-image">
                    <img src="headphone.avif" alt="Product Image" class="product-image">
                    <div class="text-overlay">New Arrival</div>
                </div>
                <div class="card-content">
                    <div class="product-company">AUDIOTECH</div>
                    <div class="product-title">Acoustic Noise Cancelling Headphones</div>
                    <div class="product-description">Experience premium sound quality with industry-leading noise cancellation. Features up to 30 hours of battery life and a comfortable over-ear design.</div>
                    <div class="product-buy-container">
                        <div class="product-price">$299.99</div>
                        <button class="add-to-cart-button">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
