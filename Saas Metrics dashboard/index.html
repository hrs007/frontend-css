<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="sidebar">
            <div class="logo">SaaS<span class="logo-highlight">Board</span></div>
            <ul class="nav-links">
                <li><a href="#" class="sidebar-link active-link"><div class="link-icon">📊</div><div>Dashboard</div></a></li>
                <li><a href="#" class="sidebar-link"><div class="link-icon">👥</div><div>Customers</div></a></li>
                <li><a href="#" class="sidebar-link"><div class="link-icon">💰</div><div>Revenue</div></a></li>
                <li><a href="#" class="sidebar-link"><div class="link-icon">⚙️</div><div>Settings</div></a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div class="header-nav-toggle">≡</div>
                <div class="header-title">Overview</div>
                <div class="profile-section">
                    <div class="profile-name">Admin User</div>
                    <img src="image.png" alt="Profile Picture" class="profile-picture">
                </div>
            </div>
           <div class="revenue-tile">
            <div class="tile-title">TOTAL REVENUE</div>
            <div class="tile-value">$45,231.89</div>
            <div class="tile-change-importance">+20.1% from last month</div>
           </div>
           <div class="active-user-tile">
            <div class="tile-title">ACTIVE USERS</div>
            <div class="tile-value">+2,350</div>
            <div class="tile-change">+180 today</div>
           </div>
           <div class="churn-rate-tile">
            <div class="tile-title">CHURN RATE</div>
            <div class="tile-value">2.4%</div>
            <div class="tile-change">-0.5% from last week</div>
           </div>
           <div class="revenue-chart-tile">
            <div class="tile-title">Revenue Overview</div>
            <div class="chart-container">
                <div class="chart-bar" style="height: 80%;"></div>
                <div class="chart-bar" style="height: 60%;"></div>
                <div class="chart-bar" style="height: 90%;"></div>
                <div class="chart-bar" style="height: 70%;"></div>
                <div class="chart-bar" style="height: 50%;"></div>
            </div>
            <div class="chart-labels">
                <div>Jan</div>
                <div>Feb</div>
                <div>Mar</div>
                <div>Apr</div>
                <div>May</div>
           </div>

        </div>

    </body>
</html>
