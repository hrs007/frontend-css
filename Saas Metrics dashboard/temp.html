<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Metrics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Using CSS Grid for the main page layout */
            display: grid;
            grid-template-columns: 230px 1fr; /* Fixed sidebar width, flexible content */
            gap: 20px;
            padding: 20px;
            background-color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            background-color: #0F172A;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo,
        .logo-highlight {
            text-align: left;
            padding: 10px 0px 30px 0px;
            font-size: 24px;
            font-weight: bolder;
            color: white;
            margin-left: 10px;
        }

        .logo-highlight {
            color: #6366F1;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sidebar-link {
            text-decoration: none;
            color: #98A6BA;
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .sidebar-link:hover:not(.active-link) {
            background-color: #ffffff19;
            color: white;
        }

        .active-link {
            background-color: #4F46E5;
            color: white;
        }

        .link-icon {
            margin-right: 15px;
            font-size: 18px;
        }

        /* --- Main Content Layout --- */
        .main-content {
            display: grid;
            /* 3 equal columns for the main content area */
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
            align-content: start; /* Keeps cards at the top if there's extra space */
        }

        /* Common Card Styles */
        .card {
            background-color: #FFFFFF;
            border-radius: 14px;
            border: 1px solid #E2E8F0;
            box-shadow: 0px 5px 10px #F0F2F4;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header spans across all 3 columns */
        .header {
            grid-column: 1 / -1; 
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-nav-toggle {
            display: none; /* Hidden on desktop */
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f172a;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-name {
            font-size: 1rem;
            font-weight: 500;
            color: #475569;
        }

        .profile-picture {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e2e8f0;
        }

        /* Revenue Tile spans 2 columns */
        .revenue-tile {
            grid-column: 1 / span 2;
        }

        /* Active User & Churn Rate naturally fall into the 3rd column */
        /* We don't even need to explicitly place them! */
        .active-user-tile {
            /* Optional: Make it slightly smaller in height if desired */
        }

        /* Chart Tile spans all 3 columns */
        .revenue-chart-tile {
            grid-column: 1 / -1; 
            min-height: 350px;
        }

        /* --- Typography & Inner Card Styles --- */
        .tile-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748B;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tile-value {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            color: #0F172A;
        }

        .tile-change {
            font-size: 0.9rem;
            color: #059669;
            font-weight: 500;
        }

        .tile-change-importance {
            background-color: #d1fae5;
            color: #059669;
            padding: 6px 12px;
            border-radius: 6px;
            width: fit-content;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* --- Chart Styles --- */
        .chart-container {
            width: 100%;
            height: 200px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: flex-end;
            gap: 40px;
            border-bottom: 2px solid #E2E8F0;
            border-left: 2px solid #E2E8F0;
            padding: 10px;
            margin-top: 20px;
        }

        .chart-bar {
            width: 100%;
            background-color: #6366F1;
            border-radius: 6px 6px 0px 0px;
            transition: background-color 0.2s;
        }

        .chart-bar:hover {
            background-color: #4F46E5;
            cursor: pointer;
        }

        .chart-labels {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 40px;
            width: 100%;
            margin-top: 15px;
            text-align: center;
        }

        .chart-labels > div {
            color: #64748B;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* --- Responsive Mobile Styles --- */
        @media (max-width: 900px) {
            body {
                /* Switch to a single column layout */
                grid-template-columns: 1fr;
                gap: 15px;
                padding: 15px;
            }

            .main-content {
                /* Make the inner grid single column as well */
                grid-template-columns: 1fr; 
            }

            /* Reset column spans so everything stacks naturally */
            .revenue-tile,
            .revenue-chart-tile {
                grid-column: 1 / -1; 
            }

            /* Turn Sidebar into a horizontal scrollable nav */
            .sidebar {
                flex-direction: row;
                align-items: center;
                padding: 10px 15px;
                overflow-x: auto;
                border-radius: 12px;
            }

            .logo {
                display: none; /* Hide logo to save space */
            }

            .nav-links {
                flex-direction: row;
                width: 100%;
            }

            .sidebar-link {
                white-space: nowrap; /* Prevent text wrapping */
                padding: 8px 15px;
            }

            .link-icon {
                margin-right: 8px;
            }

            /* Header Adjustments */
            .header-nav-toggle {
                display: block;
                font-size: 2rem;
                cursor: pointer;
                color: #0f172a;
            }

            .profile-name {
                display: none; /* Hide name on mobile */
            }

            /* Chart adjustments for smaller screens */
            .chart-container,
            .chart-labels {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">SaaS<span class="logo-highlight">Board</span></div>
        <ul class="nav-links">
            <li><a href="#" class="sidebar-link active-link"><div class="link-icon">📊</div><div>Dashboard</div></a></li>
            <li><a href="#" class="sidebar-link"><div class="link-icon">👥</div><div>Customers</div></a></li>
            <li><a href="#" class="sidebar-link"><div class="link-icon">💰</div><div>Revenue</div></a></li>
            <li><a href="#" class="sidebar-link"><div class="link-icon">⚙️</div><div>Settings</div></a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="card header">
            <div class="header-nav-toggle">≡</div>
            <div class="header-title">Overview</div>
            <div class="profile-section">
                <div class="profile-name">Admin User</div>
                <!-- Using a placeholder image for demo -->
                <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="Profile Picture" class="profile-picture">
            </div>
        </div>
        
        <!-- Revenue Card -->
        <div class="card revenue-tile">
            <div class="tile-title">Total Revenue</div>
            <div class="tile-value">$45,231.89</div>
            <div class="tile-change-importance">+20.1% from last month</div>
        </div>

        <!-- Mini Cards -->
        <div class="card active-user-tile">
            <div class="tile-title">Active Users</div>
            <div class="tile-value">+2,350</div>
            <div class="tile-change">+180 today</div>
        </div>

        <div class="card churn-rate-tile">
            <div class="tile-title">Churn Rate</div>
            <div class="tile-value">2.4%</div>
            <div class="tile-change" style="color: #64748B;">-0.5% from last week</div>
        </div>

        <!-- Chart Card -->
        <div class="card revenue-chart-tile">
            <div class="tile-title" style="margin-bottom: 0;">Revenue Overview</div>
            <div class="chart-container">
                <div class="chart-bar" style="height: 80%;"></div>
                <div class="chart-bar" style="height: 60%;"></div>
                <div class="chart-bar" style="height: 90%;"></div>
                <div class="chart-bar" style="height: 70%;"></div>
                <div class="chart-bar" style="height: 50%;"></div>
            </div>
            <div class="chart-labels">
                <div>Jan</div>
                <div>Feb</div>
                <div>Mar</div>
                <div>Apr</div>
                <div>May</div>
            </div>
        </div>

    </div>
</body>
</html>
