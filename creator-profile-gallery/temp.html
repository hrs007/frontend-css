<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Profile Gallery test</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen">
    <!-- Main Container to limit max width on large screens -->
    <div class="max-w-4xl mx-auto shadow-sm min-h-screen">
        
        <!-- Header Image Container -->
        <div class="w-full h-48 md:h-64 relative">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" class="w-full h-full object-cover" alt="Cover Photo" />
        </div>
        
        <!-- Profile Content -->
        <div class="px-4 md:px-8 py-2 pb-12">
            
            <!-- Avatar & Actions Row -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end relative mb-6">
                <!-- Negative margin pulls avatar up over the header image -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop"
                     class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-4 border-white object-cover shadow-md bg-white -mt-16 sm:-mt-20 mb-4 sm:mb-0 relative z-10" alt="Avatar" />

                <!-- Action Buttons -->
                <div class="flex flex-row gap-3 w-full sm:w-auto">
                    <button class="flex-1 sm:flex-none bg-slate-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-slate-800 transition">Follow</button>
                    <button class="flex-1 sm:flex-none bg-slate-100 text-slate-900 px-6 py-2 rounded-lg font-medium hover:bg-slate-200 transition">Message</button>
                </div>
            </div>
            
            <!-- Bio Section -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Alex Rivera</h1>
                <p class="text-indigo-600 font-medium mb-3">@arivera_design</p>
                <p class="text-slate-700 max-w-lg">
                    Digital Artist &amp; UI Designer. Creating vibrant worlds out of pixels. 🎨✨
                </p>
            </div>
            
            <!-- Stats -->
            <div class="flex flex-row gap-6 border-y border-slate-200 py-4 mb-8">
                <div class="flex flex-col">
                    <span class="font-bold text-slate-900">142</span>
                    <span class="text-sm text-slate-500">Posts</span>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-slate-900">12.5k</span>
                    <span class="text-sm text-slate-500">Followers</span>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-slate-900">405</span>
                    <span class="text-sm text-slate-500">Following</span>
                </div>
            </div>
            
            <!-- Gallery Section -->
            <div class="w-full">
                <h2 class="font-bold text-slate-900 mb-4 text-xl">Gallery</h2>
                
                <!-- CSS Grid: Auto-fill for responsive columns -->
                <div class="grid gap-2 sm:gap-4 grid-cols-[repeat(auto-fill,minmax(200px,1fr))]">
                    
                    <!-- Gallery Items (Aspect Ratio enforced via inline style or arbitrary variants) -->
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden relative group" style="aspect-ratio: 1 / 1;">
                        <img src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&amp;w=400&amp;auto=format&amp;fit=crop" alt="Gallery 0" class="w-full h-full object-cover transition duration-300 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden relative group" style="aspect-ratio: 1 / 1;">
                        <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&amp;w=400&amp;auto=format&amp;fit=crop" alt="Gallery 1" class="w-full h-full object-cover transition duration-300 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden relative group" style="aspect-ratio: 1 / 1;">
                        <img src="https://images.unsplash.com/photo-1604871000636-074fa5117945?q=80&amp;w=400&amp;auto=format&amp;fit=crop" alt="Gallery 2" class="w-full h-full object-cover transition duration-300 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden relative group" style="aspect-ratio: 1 / 1;">
                        <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=400&amp;auto=format&amp;fit=crop" alt="Gallery 3" class="w-full h-full object-cover transition duration-300 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden relative group" style="aspect-ratio: 1 / 1;">
                        <img src="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?q=80&amp;w=400&amp;auto=format&amp;fit=crop" alt="Gallery 4" class="w-full h-full object-cover transition duration-300 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden relative group" style="aspect-ratio: 1 / 1;">
                        <img src="https://images.unsplash.com/photo-1563089145-599997674d42?q=80&amp;w=400&amp;auto=format&amp;fit=crop" alt="Gallery 5" class="w-full h-full object-cover transition duration-300 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </div>
                    </div>
                    
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
