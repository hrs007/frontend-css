<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h1 class="login-txt">Login</h1>
            <form class="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="">
                <label for="password">Password</label>
                <!-- Add an hidden.png icon for password visibility toggle -->
                    <div class="password-container">
    <input type="password" id="password">
    <img src="hidden.png" alt="Hide password" class="password-icon">
</div>
                <button type="submit">Login</button>
                <div class="footer-container">
                    <div class="footer-links">
                        <footer class="forgot-footer">
                            <a href="#" class="forgot-pass-link">Forgot password?</a>
                        </footer>
                         <footer class="help-footer">
                            <a href="#" class="help-link">Help</a>
                        </footer>
                    </div>
                    <div class="footer-txt">Use the latest version of your browser for the best experience.</div>
                </div>
            </form>
        
        </div>
    </div>
</body>
</html>
