<!DOCTYPE html>
<html>
    <head>
    <title>Product Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="card-container">
            
            <div class="card">
                <img src="white-shoe.png" alt="Product Image" class="product-image"> 
               <div class="product-details-container">
                <div class="product-title-rating">
                    <div class="product-title">Classic white Sneakers</div>
                    <div class="product-rating">⭐ (4.3)</div>
                </div>

                    <div class="product-description">Minimalist sneaker made from eco-leather and soft lining.</div>
                    <div class="product-prices">
                        <div class="product-price">$30.00</div>
                        <div class="actual-price">$37.50</div>
                    </div>
                    <div class="product-size-label">
                        Size
                    </div>
                    <div class="product-sizes">
                        <div class="size">40</div>
                        <div class="size">41</div>
                        <div class="size">42</div>
                        <div class="size">43</div>
                        <div class="size">45</div>
                    </div>
                    <div class="product-stock-container">
                        <div class="product-stock-indicator"></div>
                        <div class="product-stock">In stock- Only 3 left</div>
                    </div>

                    <button class="add-to-cart-button">Add to Cart</button>
                
               </div>
            </div>

        </div>
    </body>
</html>
